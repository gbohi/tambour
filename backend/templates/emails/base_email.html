<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { margin: 0; padding: 0; background: #F5F5F3; font-family: 'Helvetica Neue', Arial, sans-serif; }
  .wrapper { max-width: 600px; margin: 32px auto; background: #FFFFFF; border-radius: 16px; overflow: hidden; }
  .header { background: #0A7C4E; padding: 32px 40px 28px; text-align: center; }
  .logo { font-size: 32px; font-weight: 900; color: white; letter-spacing: -1px; }
  .logo span { color: #F5A623; }
  .header p { color: rgba(255,255,255,0.75); font-size: 13px; margin: 6px 0 0; }
  .content { padding: 36px 40px; }
  .footer { background: #F4F4F2; padding: 20px 40px; text-align: center; font-size: 11px; color: #9B9B9B; }
  .btn { display: inline-block; background: #0A7C4E; color: white !important; text-decoration: none; padding: 14px 32px; border-radius: 12px; font-weight: 700; font-size: 15px; margin: 20px 0; }
  .info-box { background: #F0FBF6; border: 1px solid rgba(10,124,78,0.2); border-radius: 12px; padding: 16px 20px; margin: 20px 0; }
  .divider { border: none; border-top: 1px solid #E8E8E6; margin: 24px 0; }
  h1 { color: #1A1A1A; font-size: 22px; font-weight: 800; margin: 0 0 12px; }
  p { color: #6B6B6B; font-size: 14px; line-height: 1.7; margin: 0 0 12px; }
  .row { display: flex; justify-content: space-between; margin: 8px 0; }
  .label { color: #9B9B9B; font-size: 12px; }
  .value { color: #1A1A1A; font-size: 13px; font-weight: 600; }
</style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <div class="logo">Yô<span>Bus</span></div>
    <p>Voyagez serein à travers la Côte d'Ivoire</p>
  </div>
  <div class="content">
    {% block content %}{% endblock %}
  </div>
  <div class="footer">
    <p>© 2026 YôBus CI · Abidjan, Côte d'Ivoire</p>
    <p>Cet email a été envoyé automatiquement, merci de ne pas y répondre.</p>
  </div>
</div>
</body>
</html>
