name: tambour
description: TamBour — Réservation de transport interurbain en Côte d'Ivoire
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  qr_flutter: ^4.1.0
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  flutter_animate: ^4.5.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^12.0.2
  url_launcher: ^6.3.3
  geolocator: ^14.0.2
  mobile_scanner: ^7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  # Application construite par défaut (voir android/app/build.gradle)
  default-flavor: passager
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/paiements/
    - assets/fonts/
  # Police de la marque embarquée (hors ligne). Aussi utilisée par google_fonts, qui
  # privilégie les fichiers locaux portant le nom attendu (Outfit-Bold.ttf…).
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fonts/Outfit-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Outfit-Black.ttf
          weight: 900
