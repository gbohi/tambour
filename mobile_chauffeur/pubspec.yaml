name: tambour_chauffeur
description: TamBour Pro — application des chauffeurs (trajets, contrôle des billets, suivi en temps réel).
publish_to: none
version: 1.0.0+1

environment:
  # Flutter 3.44 minimum (Dart 3.13), requis par les dépendances (url_launcher, share_plus, geolocator…)
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  tambour_commun:
    path: ../mobile_commun
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3
  go_router: ^14.2.0
  intl: ^0.19.0
  flutter_animate: ^4.5.0
  mobile_scanner: ^7.4.2
  geolocator: ^14.0.2
  permission_handler: ^11.3.1
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Police de la marque, fournie par tambour_commun (mobile_commun/lib/fonts).
  # google_fonts privilégie aussi ces fichiers locaux (Outfit-Bold.ttf…), donc fonctionne hors ligne.
  fonts:
    - family: Outfit
      fonts:
        - asset: packages/tambour_commun/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: packages/tambour_commun/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: packages/tambour_commun/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: packages/tambour_commun/fonts/Outfit-Bold.ttf
          weight: 700
        - asset: packages/tambour_commun/fonts/Outfit-ExtraBold.ttf
          weight: 800
        - asset: packages/tambour_commun/fonts/Outfit-Black.ttf
          weight: 900
