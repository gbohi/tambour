name: tambour_commun
description: Code partagé par les applications TamBour (voyageurs) et TamBour Pro (chauffeurs) — thème, connexion, API, widgets, logo et police.
publish_to: none
version: 1.0.0

environment:
  # Flutter 3.44 minimum (Dart 3.13), requis par les dépendances (url_launcher, share_plus, geolocator…)
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  # Pour le banc de test partagé (lib/testing/debordements.dart), utilisé uniquement par les tests des apps.
  flutter_test:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  flutter_secure_storage: ^9.0.0
  intl: ^0.19.0
  flutter_animate: ^4.5.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  assets:
    - assets/images/
