name: tambour_passager
description: TamBour — application voyageurs (réservation de cars en Côte d'Ivoire).
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  tambour_commun:
    path: ../mobile_commun
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3
  go_router: ^14.2.0
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  flutter_animate: ^4.5.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^12.0.2
  url_launcher: ^6.3.3
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/paiements/
  # Police de la marque, fournie par tambour_commun (mobile_commun/lib/fonts).
  # google_fonts privilégie aussi ces fichiers locaux (Outfit-Bold.ttf…), donc fonctionne hors ligne.
  fonts:
    - family: Outfit
      fonts:
        - asset: packages/tambour_commun/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: packages/tambour_commun/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: packages/tambour_commun/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: packages/tambour_commun/fonts/Outfit-Bold.ttf
          weight: 700
        - asset: packages/tambour_commun/fonts/Outfit-ExtraBold.ttf
          weight: 800
        - asset: packages/tambour_commun/fonts/Outfit-Black.ttf
          weight: 900
